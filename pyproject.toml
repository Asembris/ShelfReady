[project]
name = "shelfready"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.2",
    "openai==2.7.1",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
    "starlette==1.10.0", # Minimum common fix for the audited Starlette advisories
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: requires a running Docker engine and downloaded images"]
