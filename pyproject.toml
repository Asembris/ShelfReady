[project]
name = "shelfready"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.133.0",
    "openai==3.42.1",
    "python-dotenv==1.2.4",
    "uvicorn==0.38.0",
    "starlette==1.3.1", # Minimum common fix for the audited Starlette advisories
]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: requires a running Docker engine and downloaded images"]
