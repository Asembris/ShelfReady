name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Offline Python and Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.18'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q -m 'not live' --offline --strict-markers --junitxml=artifacts/ci/python.xml
      - name: Retain failed test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-failure
          path: artifacts/ci/python.xml
          if-no-files-found: ignore
          retention-days: 7
  web:
    name: Portable browser and production frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run format:check && npm run build
        working-directory: web
      - run: npm exec -- playwright install --with-deps chromium
        working-directory: web
      - run: node scripts/validate_brand.mjs
      - run: npm run test:ci
        working-directory: web
      - name: Retain failed browser evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-browser-failure
          path: |
            web/test-results/
            web/playwright-report/
            artifacts/brand/production-validation/
          if-no-files-found: ignore
          retention-days: 7
