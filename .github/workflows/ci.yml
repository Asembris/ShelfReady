name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Offline Python and Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.18'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q -m 'not live' --offline --strict-markers --junitxml=artifacts/ci/python.xml
      - name: Retain failed test report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-failure
          path: artifacts/ci/python.xml
          if-no-files-found: ignore
          retention-days: 7
  web:
    name: Portable browser and production frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run format:check && npm run build
        working-directory: web
      - run: npm exec -- playwright install --with-deps chromium
        working-directory: web
      - run: node scripts/validate_brand.mjs
      - name: Validate README artwork and local links
        run: node scripts/validate_showcase.mjs
      - name: Check showcase documentation formatting
        run: npm exec -- prettier --check ../README.md ../docs/readme-showcase.md ../scripts/validate_showcase.mjs
        working-directory: web
      - run: npm run test:ci
        working-directory: web
      - name: Retain failed browser evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-browser-failure
          path: |
            web/test-results/
            web/playwright-report/
            artifacts/brand/production-validation/
          if-no-files-found: ignore
          retention-days: 7
