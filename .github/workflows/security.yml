name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Full-history redacted Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every fetched ref without secret values
        run: |
          mkdir -p artifacts/ci
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts=--all --report-format json --report-path artifacts/ci/gitleaks-redacted.json
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: redacted-secret-scan
          path: artifacts/ci/gitleaks-redacted.json
          if-no-files-found: ignore
          retention-days: 7
  dependencies:
    name: Locked npm and Python dependency audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.18'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Audit all locked npm dependencies
        run: |
          mkdir -p ../artifacts/ci
          npm audit --audit-level=low --json > ../artifacts/ci/npm-audit.json
        working-directory: web
      - name: Audit all locked Python dependencies
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/ci
          uv export --frozen --no-emit-project --format requirements-txt --output-file artifacts/ci/requirements.txt > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit -r artifacts/ci/requirements.txt --no-deps --disable-pip --require-hashes --progress-spinner off --timeout 30 --format json --output artifacts/ci/pip-audit.json
      - name: Retain dependency audit reports on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-audit-failure
          path: |
            artifacts/ci/npm-audit.json
            artifacts/ci/pip-audit.json
          if-no-files-found: ignore
          retention-days: 7
